<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井字過三關 | Tic-Tac-Toe</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 透過 CDN 引入 PeerJS，移除 Node.js 依賴 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- 使用 type="module" 啟用 ES6 模組功能 -->
    <script src="js/index.js" type="module" defer></script>
</head>
<body>
    <main class="container">
        <h1>井字過三關</h1>
        <div class="game-info">
            <p data-testid="game-status">輪到玩家 X</p>
        </div>
        <div class="board" data-testid="board">
            <!-- JavaScript 會動態生成 9 個格子 -->
        </div>
        <button class="reset-button" data-testid="reset-button">重新開始</button>
    </main>

    <!-- 遊戲模式選擇 Modal -->
    <div class="modal" data-testid="modal">
        <div class="modal-content">
            <h2>選擇遊戲模式</h2>
            <button data-testid="local-mode-btn">🕹️ 本地雙人</button>
            <button data-testid="p2p-mode-btn">🌐 線上對戰</button>
            
            <div class="p2p-menu hidden" data-testid="p2p-menu">
                <p>你的ID: <strong data-testid="player-id">載入中...</strong></p>
                <input type="text" placeholder="輸入對手ID" data-testid="remote-id-input">
                <button data-testid="connect-btn">連線</button>
                <p class="p2p-status" data-testid="p2p-status"></p>
            </div>
        </div>
    </div>
</body>
</html>
